# tallydeck — shared config, tracked in git.
#
# This file is versioned WITH the code, so a `git pull` brings settings and the
# code that reads them in step. Machine-specific or private values do NOT go
# here — put those in ~/.config/tallydeck/config.toml, which is not tracked and
# is merged on top of this file.
#
# Rule of thumb for what may live here: hosts, paths and preferences. Never a
# token, key, or anything you would not want in a repo — private or not, the
# habit is what keeps you safe, not the visibility flag.

[view]
device = "neo"          # neo 2x4 · mk2 3x5 · mini 2x3 · xl 4x8
hide_idle = false
# Info-bar layout: "split" = one A/B bar (A top half, B bottom) with the Codex
# lane underneath; "quadrant" = A/B bar left, clocks top-right, Codex bottom-
# right. The right touch point flips between them on a single-page deck.
meter = "split"

[client]
# The hub runs on your server; the deck is wherever you are. Both ends read
# this same file, and each ignores what does not apply to it.
#
# "claw" here is an ssh alias, not a hostname — put the real host in your
# ~/.ssh/config (see the README) so no address ever lands in the repo. Change
# it to whatever you named yours, or export TALLY_SSH_HOST.
connect = ["ssh", "claw", "~/.local/bin/tallyd"]

# Run on the machine holding the deck when a key is pressed. Absent on the hub,
# which is fine — nothing there presses keys.
on_press = ["~/bin/tally-open-mac.sh"]

# How often the deck asks the hub for a fresh snapshot. This is the dominant
# term in how stale the display looks — key redraws are already cached per key
# and a press wakes the loop immediately, so latency you can see is almost
# always this number. Lower costs a little ssh chatter and nothing else.
poll_every = 1.0

[[sources]]
kind = "claude-sessions"
# tmux sessions holding disposable one-shot runners: never flash, rank last,
# render muted. Persistent sessions always outrank them.
oneshot_sessions = ["oneshot"]
# One entry per Claude account. The label lands on the key as a badge, so you
# can see WHICH quota a working session is draining rather than guessing.
# Second and later accounts live under their own CLAUDE_CONFIG_DIR, so their
# path is machine-specific — put those in the user layer, not here.
roots = [
  { label = "A", path = "~/.claude/projects" },
]

[[sources]]
kind = "watchdir"

[[sources]]
kind = "tokenburn"      # meter simply vanishes if the API is not up
# tz = "America/New_York"   # window-reset clock; default is this machine's

# Optional: where the brief looks up open task-queue items for a project.
# argv, run with the project name matched against its stdout. Left unset the
# brief simply omits the section — no external tool is required.
# [brief]
# tasks_cmd = ["python3", "~/bin/my-task-queue.py", "list"]
