[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tallydeck"
version = "0.1.0"
description = "Project the attention state of many running agents onto a Stream Deck — tally lights for your fleet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mr. Bernard" }]
dependencies = [
    "Pillow>=10",
]

[project.optional-dependencies]
deck = ["streamdeck>=0.9.6"]        # real hardware (needs hidapi: `brew install hidapi`)
dev = ["pytest>=8"]

[project.scripts]
tally = "tallydeck.cli:main"
tallyd = "tallydeck.cli:main_serve"

[tool.setuptools.packages.find]
include = ["tallydeck*"]

[tool.setuptools.package-data]
tallydeck = ["fonts/*.ttf"]
